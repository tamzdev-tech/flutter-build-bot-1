name: Flutter Build APK

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Job ID'
        required: false
      zip_path:
        description: 'Zip Path'
        required: false
      zip_url:
        description: 'Zip URL'
        required: false
      download_url:
        description: 'Source code zip URL'
        required: false
      tag:
        description: 'Build tag'
        required: false
      build_type:
        description: 'Build type'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'

      - name: Build APK Placeholder
        run: echo "Build script berjalan"
